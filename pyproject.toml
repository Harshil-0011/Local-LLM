[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-perplex"
version = "1.0.0"
description = "A premium local alternative to Perplexity AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pyyaml",
    "click",
    "fastapi",
    "uvicorn",
    "jinja2",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "ddgs",
    "beautifulsoup4",
    "pypdf",
    "python-docx",
    "openpyxl",
    "cachetools"
]

[project.scripts]
perplex = "local_perplex.ui.cli:main"
perplex-gui = "local_perplex.ui.web.app:main"

[tool.setuptools.packages.find]
include = ["local_perplex*"]

[tool.setuptools.package-data]
"local_perplex.ui.web" = ["templates/*.html", "static/*.css"]
