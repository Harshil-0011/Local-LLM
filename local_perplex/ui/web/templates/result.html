<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Result - Local Perplex</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header style="margin-bottom: 40px;">
            <a href="/" style="color: var(--secondary-text); text-decoration: none; font-size: 14px;">← New Research</a>
            <h2 style="margin-top: 20px; font-size: 28px;">{{ question }}</h2>
        </header>

        <div class="glass-card">
            <div style="font-size: 18px; line-height: 1.6; white-space: pre-wrap;">{{ answer }}</div>
        </div>

        <h3 style="margin-top: 60px; margin-bottom: 24px;">Sources ({{ sources|length }})</h3>
        <div class="glass-card">
            {% for s in sources %}
                <div class="source-item">
                    <a href="{{ s.url }}" class="source-title" target="_blank">{{ s.title }}</a>
                    <div class="source-url">{{ s.url }}</div>
                    <div style="font-size: 11px; color: var(--secondary-text); margin-top: 4px;">Relevance: {{ "%.4f"|format(s.relevance) }}</div>
                </div>
            {% endfor %}
        </div>
    </div>

    <script>
        const body = document.body;
        const savedTheme = localStorage.getItem('theme') || 'light';
        body.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
