<!DOCTYPE html>
<html>
<head>
    <title>Local Perplex - Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <a href="/" class="btn btn-outline-secondary mb-4">Back</a>
    <h2>{{ question }}</h2>
    <hr>
    <div class="card mb-4">
        <div class="card-body">
            <p class="card-text" style="white-space: pre-wrap;">{{ answer }}</p>
        </div>
    </div>
    <h3>Sources ({{ sources|length }})</h3>
    <ul class="list-group">
        {% for s in sources %}
            <li class="list-group-item">
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1"><a href="{{ s.url }}" target="_blank">{{ s.title }}</a></h5>
                    <small>Relevance: {{ "%.4f"|format(s.relevance) }}</small>
                </div>
                <small class="text-muted">{{ s.url }}</small>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
