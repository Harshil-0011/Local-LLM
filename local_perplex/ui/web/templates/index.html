<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Perplex</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px;">
            <h1 style="font-size: 32px; margin: 0;">Local Perplex</h1>
            <button id="theme-toggle" style="padding: 8px 16px;">Theme</button>
        </div>

        <div class="glass-card">
            <h2 style="margin-top: 0; margin-bottom: 24px;">Discover without limits.</h2>
            <form action="/ask" method="post">
                <input type="text" name="question" placeholder="What would you like to research today?" required autofocus>

                <div class="mode-selector">
                    <label class="mode-option active" id="mode-std">
                        <input type="radio" name="mode" value="industry_standard" checked style="display: none;">
                        Industry Standard
                    </label>
                    <label class="mode-option" id="mode-all">
                        <input type="radio" name="mode" value="all_references" style="display: none;">
                        All References
                    </label>
                </div>

                <button type="submit" style="width: 100%; font-size: 18px; padding: 16px;">Ask AI</button>
            </form>
        </div>

        {% if history %}
        <div style="margin-top: 60px;">
            <h3 style="margin-bottom: 24px;">Recent Research</h3>
            {% for session in history[:5] %}
            <div class="glass-card" style="padding: 16px; margin-bottom: 12px; cursor: pointer;" onclick="window.location.href='/history/{{ loop.index0 }}'">
                <div style="display: flex; justify-content: space-between;">
                    <span style="font-weight: 500;">{{ session.question }}</span>
                    <span style="color: var(--secondary-text); font-size: 12px;">{{ session.timestamp[:10] }}</span>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <div style="text-align: center; margin-top: 40px;">
            <p style="color: var(--secondary-text); font-size: 14px;">Powered by Ollama • C++ Core • Private by Design</p>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        // Load theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        body.setAttribute('data-theme', savedTheme);

        // Mode toggling UI
        const modeStd = document.getElementById('mode-std');
        const modeAll = document.getElementById('mode-all');

        modeStd.addEventListener('click', () => {
            modeStd.classList.add('active');
            modeAll.classList.remove('active');
        });
        modeAll.addEventListener('click', () => {
            modeAll.classList.add('active');
            modeStd.classList.remove('active');
        });
    </script>
</body>
</html>
