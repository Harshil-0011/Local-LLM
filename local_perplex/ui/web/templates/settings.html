<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Local Perplex</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header style="margin-bottom: 40px;">
            <a href="/" style="color: var(--secondary-text); text-decoration: none; font-size: 14px;">← Back</a>
            <h1 style="margin-top: 20px;">Settings</h1>
        </header>

        <div class="glass-card">
            <h3 style="margin-top: 0; margin-bottom: 24px;">Model Configuration</h3>
            <form action="/settings" method="post">
                <div class="mb-3">
                    <label class="form-label" style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--secondary-text);">Active Ollama Model</label>
                    <input type="text" name="model" value="{{ model }}" style="font-size: 16px;">
                </div>
                <button type="submit" style="width: 100%;">Save Preferences</button>
            </form>
        </div>

        <div class="glass-card" style="margin-top: 40px;">
            <h3 style="margin-top: 0; margin-bottom: 12px;">System Stats</h3>
            <p style="font-size: 14px; color: var(--secondary-text);">Core Engine: <span style="color: var(--text-color); font-weight: 500;">C++ (Native)</span></p>
            <p style="font-size: 14px; color: var(--secondary-text);">Synthesis: <span style="color: var(--text-color); font-weight: 500;">Ollama (Local)</span></p>
        </div>
    </div>

    <script>
        const body = document.body;
        const savedTheme = localStorage.getItem('theme') || 'light';
        body.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
