<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Local Perplex</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body data-theme="dark">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="nothing-dot"></span>
            local perplex
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                Search
            </a>
            <a href="/vault" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                Vault
            </a>
            <a href="/settings" class="nav-item active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Settings
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content" style="justify-content: flex-start; align-items: stretch;">
        <div style="max-width: 800px; margin: 0 auto; width: 100%;">
            <header style="margin-bottom: 40px;">
                <h1 style="font-size: 32px; letter-spacing: -0.04em; margin-bottom: 8px;">Settings</h1>
                <p style="color: var(--secondary-text);">Configure your local research preferences.</p>
            </header>

            <div class="glass-card" style="margin-bottom: 32px;">
                <h3 style="margin-top: 0; margin-bottom: 24px; font-size: 18px;">Model Configuration</h3>
                <form action="/settings" method="post">
                    <div style="margin-bottom: 24px;">
                        <label style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--secondary-text);">Active Ollama Model</label>
                        <input type="text" name="model" value="{{ model }}" style="width: 100%; box-sizing: border-box; background: var(--input-bg); border: 1px solid var(--border-color); color: #fff; padding: 12px; border-radius: 8px; font-size: 16px; outline: none;">
                        <p style="font-size: 12px; color: #444; margin-top: 8px;">We recommend using <strong>llama3.2-vision</strong> for full lens support.</p>
                    </div>
                    <button type="submit" class="pill-btn active" style="width: 100%;">Save Changes</button>
                </form>
            </div>

            <div class="glass-card">
                <h3 style="margin-top: 0; margin-bottom: 12px; font-size: 18px;">System Stats</h3>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border-color);">
                        <span style="font-size: 14px; color: var(--secondary-text);">Core Engine</span>
                        <span style="font-size: 14px; color: var(--text-color); font-weight: 600;">C++ (Native Core)</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px;">
                        <span style="font-size: 14px; color: var(--secondary-text);">Synthesis</span>
                        <span style="font-size: 14px; color: var(--text-color); font-weight: 600;">Ollama (Local Inference)</span>
                    </div>
                </div>
            </div>

            <div style="margin-top: 40px; text-align: center;">
                <a href="/privacy" style="color: var(--secondary-text); text-decoration: none; font-size: 13px; font-weight: 500;">Privacy & Security Audit →</a>
            </div>
        </div>
    </main>
</body>
</html>
