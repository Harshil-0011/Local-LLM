{% extends "base.html" %}
{% block content %}
    <h1>Project Wizard</h1>
    <p>Welcome to the local project generator using Ollama.</p>
    <div class="card mt-4">
        <div class="card-body">
            <h5 class="card-title">Start a new project</h5>
            <form action="/interview" method="get">
                <div class="mb-3">
                    <label for="output_dir" class="form-label">Project Output Directory</label>
                    <input type="text" class="form-control" id="output_dir" name="output_dir" value="{{ config.default_output_dir }}">
                </div>
                <button type="submit" class="btn btn-primary">Start Interview</button>
            </form>
        </div>
    </div>
{% endblock %}
