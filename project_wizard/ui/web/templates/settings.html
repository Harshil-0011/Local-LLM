{% extends "base.html" %}
{% block content %}
    <h1>Settings</h1>
    <form action="/settings" method="post">
        <div class="mb-3">
            <label for="ollama_base_url" class="form-label">Ollama Base URL</label>
            <input type="text" class="form-control" id="ollama_base_url" name="ollama_base_url" value="{{ config.ollama_base_url }}">
        </div>
        <div class="mb-3">
            <label for="planner_model" class="form-label">Planner Model</label>
            <input type="text" class="form-control" id="planner_model" name="planner_model" value="{{ config.planner_model }}">
        </div>
        <div class="mb-3">
            <label for="coder_model" class="form-label">Coder Model</label>
            <input type="text" class="form-control" id="coder_model" name="coder_model" value="{{ config.coder_model }}">
        </div>
        <div class="mb-3">
            <label for="default_output_dir" class="form-label">Default Output Directory</label>
            <input type="text" class="form-control" id="default_output_dir" name="default_output_dir" value="{{ config.default_output_dir }}">
        </div>
        <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>
{% endblock %}
