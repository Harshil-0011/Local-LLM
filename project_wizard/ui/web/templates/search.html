{% extends "base.html" %}
{% block content %}
    <h1>AI Search (Perplexity Style)</h1>
    <form action="/search" method="post">
        <div class="mb-3">
            <label for="question" class="form-label">What do you want to know?</label>
            <input type="text" class="form-control" id="question" name="question" placeholder="e.g. Where do you think LLM will move towards in future??">
        </div>
        <div class="mb-3">
            <label class="form-label">Search Mode</label>
            <select class="form-select" name="mode">
                <option value="industry_standard">Industry Standard</option>
                <option value="all_references">All References</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Search and Answer</button>
    </form>
{% endblock %}
