{% extends "base.html" %}
{% block content %}
    <h1>Project Specification</h1>
    <p>Output Directory: {{ output_dir }}</p>

    <div class="mb-4">
        <form action="/build-spec" method="post">
            <input type="hidden" name="output_dir" value="{{ output_dir }}">
            <button type="submit" class="btn btn-warning">Rebuild Specification</button>
        </form>
    </div>

    {% if spec_content %}
        <div class="card bg-light">
            <div class="card-body">
                <pre class="mb-0" style="white-space: pre-wrap;">{{ spec_content }}</pre>
            </div>
        </div>
        <div class="mt-4">
            <form action="/generate-code" method="post">
                <input type="hidden" name="output_dir" value="{{ output_dir }}">
                <button type="submit" class="btn btn-success btn-lg">Generate Code Project</button>
            </form>
        </div>
    {% else %}
        <p>No specification generated yet. Click "Rebuild Specification" to start building it using Ollama.</p>
        <form action="/build-spec" method="post">
            <input type="hidden" name="output_dir" value="{{ output_dir }}">
            <button type="submit" class="btn btn-primary">Build Specification</button>
        </form>
    {% endif %}
{% endblock %}
