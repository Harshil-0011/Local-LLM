{% extends "base.html" %}
{% block content %}
    <h1>Search Result</h1>
    <div class="card mb-4">
        <div class="card-header">Question</div>
        <div class="card-body">
            <h5 class="card-title">{{ question }}</h5>
        </div>
    </div>

    <div class="card mb-4 border-success">
        <div class="card-header bg-success text-white">AI Answer</div>
        <div class="card-body">
            <p class="card-text" style="white-space: pre-wrap;">{{ answer }}</p>
        </div>
    </div>

    <h3>Sources Read</h3>
    <ul class="list-group">
        {% for s in sources %}
            <li class="list-group-item">
                <a href="{{ s.url }}" target="_blank">{{ s.title }}</a>
                <br><small class="text-muted">{{ s.url }}</small>
            </li>
        {% endfor %}
    </ul>

    <div class="mt-4">
        <a href="/search" class="btn btn-primary">New Search</a>
    </div>
{% endblock %}
