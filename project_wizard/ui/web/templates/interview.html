{% extends "base.html" %}
{% block content %}
    <h1>Project Interview</h1>
    <form action="/interview" method="post">
        <input type="hidden" name="output_dir" value="{{ output_dir }}">
        {% for q in questions %}
            <div class="mb-3">
                <label for="{{ q.id }}" class="form-label">{{ q.text }}</label>
                <input type="text" class="form-control" id="{{ q.id }}" name="{{ q.id }}" value="{{ answers.get(q.id, q.default) }}">
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save and Build Spec</button>
    </form>
{% endblock %}
